# ==========================================
# 1. APLICAÇÃO E SERVIDOR
# ==========================================
spring.application.name=izzy-financs
server.port=8080

# ==========================================
# 2. CONEXÃO COM O BANCO DE DADOS (MySQL)
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/financial_manager?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# 3. JPA E HIBERNATE
# ==========================================
# Deixamos no 'validate' porque quem manda no banco agora é o Flyway!
spring.jpa.hibernate.ddl-auto=validate

# Mostra as queries no console formatadinhas (ajuda muito a debugar)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true