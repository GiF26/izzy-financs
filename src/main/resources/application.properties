spring.datasource.url=jdbc:mysql://localhost:3306/financial_manager
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.show-sql=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.application.name=izzy-financs

# ==========================================
# CONFIGURAÇÕES DO FLYWAY (FORÇA BRUTA)
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Dá ao Flyway uma conexão independente do Hibernate
spring.flyway.url=jdbc:mysql://localhost:3306/financial_manager
spring.flyway.user=root
spring.flyway.password=root

# Liga o log do Flyway para vermos o que ele está pensando
logging.level.org.flywaydb=DEBUG